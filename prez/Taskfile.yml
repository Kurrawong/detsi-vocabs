# https://taskfile.dev

version: "3"

tasks:
  uv:sync:
    desc: Sync python dependencies
    cmd: uv sync --locked --all-extras --dev

  uv:export:
    desc: Export python dependencies to requirements.txt
    cmd: uv export --output-file requirements.txt -q

  vocabs:build:
    desc: Build the oxigraph data
    cmds:
      - uv tool install prezmanifest
      - uv run pm validate ../manifest.ttl
      - uv run pm load file ../manifest.ttl data.trig
      - uv run oxigraph load --location pyoxigraph_data_dir --format application/trig --file data.trig
      - uv run oxigraph optimize --location pyoxigraph_data_dir

  dev:
    desc: Run the development server
    cmd: uv run func start
